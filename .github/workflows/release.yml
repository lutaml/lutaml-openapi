# Self-contained release train. This gem's RubyGems Trusted Publisher is
# registered against THIS repository's release.yml, so the OIDC credential
# exchange has to run from here — a call into metanorma/ci's reusable
# workflow carries metanorma/ci's job_workflow_ref and can never match.
name: release

permissions:
  contents: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: 'Next release version: x.y.z, major, minor, patch, or skip'
        required: true
        default: "skip"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install bundle and release tooling
        run: |
          rm -f Gemfile.lock
          bundle install
          gem install gem-release

      - name: Build SPA dist (packaged only at release time)
        run: cd frontend && npm install --package-lock-only && npm ci && npm run build

      - name: Bump version
        if: inputs.next_version != 'skip'
        env:
          NEXT: ${{ inputs.next_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gemspec=$(ls -- *.gemspec | head -n1)
          vf=$(ruby -Ilib -e 's = Gem::Specification.load(ARGV[0]); f = s.files.grep(%r{(^|/)version\.rb\z}).find { |x| File.read(x) =~ /^\s*VERSION\s*=/ }; abort "version file not found" unless f; puts f' "$gemspec")
          next=$(ruby -e 'seg = ARGV[1]; abort "unsupported next_version #{seg}" unless %w[major minor patch].include?(seg) || seg =~ /\A\d+\.\d+\.\d+\z/; cur = File.read(ARGV[0])[/VERSION\s*=\s*"([^"]+)"/, 1] or abort "cannot read VERSION"; p = cur.split(".").map(&:to_i); puts(seg == "major" ? "#{p[0] + 1}.0.0" : seg == "minor" ? "#{p[0]}.#{p[1] + 1}.0" : seg == "patch" ? "#{p[0]}.#{p[1]}.#{p[2] + 1}" : seg)' "$vf" "$NEXT")
          gem bump --file "$vf" --version "$next" --no-commit
          git add "$vf"
          git commit -m "Bump version to ${next}"
          git push origin "HEAD:main"
          echo "NEXT=${next}" >> "$GITHUB_ENV"

      - name: Configure RubyGems credentials via Trusted Publishing
        uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Build and push the gem
        run: |
          set -euo pipefail
          gemspec=$(ls -- *.gemspec | head -n1)
          gem build "$gemspec"
          gemfile=$(ls -- *.gem | head -n1)
          name=$(ruby -e 'puts Gem::Specification.load(ARGV[0]).name' "$(ls -- *.gemspec | head -n1)")
          ver=$(ruby -e 'puts Gem::Specification.load(ARGV[0]).version' "$(ls -- *.gemspec | head -n1)")
          if gem list -r -e "^${name}$" | grep -q "(\\(${ver}\\))"; then
            echo "::warning::${name} ${ver} is already on rubygems.org; skipping push"
          else
            gem push "$gemfile"
          fi

      - name: Tag the release
        if: inputs.next_version != 'skip'
        run: |
          set -euo pipefail
          tag="v$(ruby -e 'puts Gem::Specification.load(ARGV[0]).version' "$(ls -- *.gemspec | head -n1)")"
          if git ls-remote --tags origin "refs/tags/${tag}" | grep -q .; then
            echo "::warning::${tag} already exists; skipping"
          else
            git tag -a "$tag" -m "Release ${tag}"
            git push origin "refs/tags/${tag}"
          fi
