    value:
      $ref: schemas/processes-core/value.yaml
      description: A permitted value of an input with an optional human-readable label.
    collectionValue:
      $ref: schemas/processes-core/collectionValue.yaml
      description: A result value hosted as a collection.
    valueNoObject:
      $ref: schemas/processes-core/valueNoObject.yaml
      description: A literal or array value of an input, excluding object values.
    valueNoObject-workflows:
      $ref: schemas/processes-workflows/valueNoObject-workflows.yaml
      description: A literal or array value of a workflow input, excluding object values.
    jobControlOptions:
      $ref: schemas/processes-core/jobControlOptions.yaml
      description: 'The job control options supported by this API: asynchronous execution, synchronous
        execution and/or dismiss of running jobs.'
    metadata:
      $ref: schemas/processes-core/metadata.yaml
      description: 'Additional metadata of a process, input or output: roles with typed values or external
        references.'
    values:
      $ref: schemas/processes-core/values.yaml
      description: The permitted values of an input, as an enumeration, range or schema.
    values-workflows:
      $ref: schemas/processes-workflows/values-workflows.yaml
      description: The permitted values of a workflow input, as an enumeration, range or schema.
    outputSelection:
      $ref: schemas/processes-core/outputSelection.yaml
      description: Selects the outputs of a process to be included in the results of an execution; by
        default all outputs are returned.
    outputDescription:
      $ref: schemas/processes-core/outputDescription.yaml
      description: A description of an output of a process, including its schema and metadata.
    qualifiedValue:
      $ref: schemas/processes-core/qualifiedValue.yaml
      description: A value together with the format it is encoded in, used where multiple formats are
        supported.
    reference:
      $ref: schemas/processes-core/reference.yaml
      description: 'A reference to external metadata: the role of the reference and its URL.'
    results:
      $ref: schemas/processes-core/results.yaml
      description: The outputs of a successfully completed job execution. Each output is identified by
        its identifier in the process description.
    schema:
      $ref: schemas/processes-core/schema.yaml
      description: The schema constraining the values of an input or output.
    statusCode:
      $ref: schemas/processes-core/statusCode.yaml
      description: 'The state of the job execution: accepted, running, successful, failed or dismissed.'
    subscriber:
      $ref: schemas/processes-core/subscriber.yaml
      description: Optional subscriber endpoints the client may supply so that the API can asynchronously
        notify the client about job progress and completion.
    inlineOrRefValue:
      $ref: schemas/processes-core/inlineOrRefValue.yaml
      description: Either an inline literal, object or array value, or a reference to a remote value that
        is fetched at execution time.
    inlineOrRefValue-workflows:
      $ref: schemas/processes-workflows/inlineOrRefValue-workflows.yaml
      description: Either an inline literal, object or array value, or a reference to a remote value,
        for workflow inputs and outputs.
    fieldsModifiers:
      $ref: schemas/processes-core/fieldsModifiers.yaml
      description: Modifiers restricting the fields (properties) of an input or output object.
    statusInfo:
      $ref: schemas/processes-core/statusInfo.yaml
      description: The status of an execution job, including its current state (accepted, running, successful,
        failed or dismissed) and, once available, the location of the results.
    dataAccessAPIs:
      $ref: schemas/processes-core/dataAccessAPIs.yaml
      description: The data access APIs through which the outputs of a job can be retrieved.
    apis:
      $ref: schemas/processes-core/apis.yaml
      description: The conformance classes and entry points of the APIs advertised by this deployment.
    dataClasses:
      $ref: schemas/processes-core/dataClasses.yaml
      description: The data classes supported by a process deployment.
    ogcapppkg:
      $ref: schemas/processes-dru/ogcapppkg.yaml
      description: 'An OGC API - Processes application package (OGC App-Pkg): the deployment description
        of a process, referencing or embedding the executable artifacts.'
    staticIndicator:
      $ref: schemas/processes-dru/staticIndicator.yaml
      description: Indicates whether the input value of a workflow is static (identical for every nested
        execution) or dynamic.
