    CWLCommand:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/CWLCommand
      description: The command-line template of a CWL tool or expression tool.
    InputBinding:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/InputBinding
      description: The command-line binding of a CWL input parameter.
    CWLInputItem:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/CWLInputItem
      description: One input parameter of a CWL process.
    DirectoryListingDirent:
