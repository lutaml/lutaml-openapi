      description: One entry of a directory listing in a CWL initial work directory.
    DirectoryListingFileOrDirectory:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/DirectoryListingFileOrDirectory
      description: A file or directory entry in a CWL directory listing.
    SoftwareRequirement:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/SoftwareRequirement
      description: A CWL requirement listing the software packages the execution needs.
    DockerRequirement:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/DockerRequirement
      description: A CWL requirement specifying the Docker image in which the process executes.
    ShellCommandRequirement:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/ShellCommandRequirement
      description: A CWL requirement enabling shell command expressions in the command line.
    EnvVarRequirement:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/EnvVarRequirement
      description: A CWL requirement defining environment variables for the execution.
    SchemaDefRequirement:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/SchemaDefRequirement
      description: A CWL requirement defining custom schemas used by the inputs and outputs.
    InitialWorkDirRequirement:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/InitialWorkDirRequirement
      description: A CWL requirement staging files into the initial working directory.
    InlineJavascriptRequirement:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/InlineJavascriptRequirement
      description: A CWL requirement enabling inline Javascript expressions.
    InplaceUpdateRequirement:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/InplaceUpdateRequirement
      description: A CWL requirement declaring in-place update semantics for nested outputs.
    LoadListingRequirement:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/LoadListingRequirement
      description: A CWL requirement controlling how directory inputs are loaded into listings.
    NetworkAccessRequirement:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/NetworkAccessRequirement
      description: A CWL requirement declaring the network access needs of the tool.
    ResourceRequirement:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/ResourceRequirement
      description: A CWL requirement declaring the compute resources (cores, memory, tmpdir) of the execution.
    ScatterFeatureRequirement:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/ScatterFeatureRequirement
      description: A CWL requirement enabling scattering an input over multiple executions.
    WorkReuseRequirement:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/WorkReuseRequirement
      description: A CWL requirement controlling reuse of prior execution outputs.
    ToolTimeLimitRequirement:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/ToolTimeLimitRequirement
      description: A CWL requirement limiting the tool execution time.
    MultipleInputFeatureRequirement:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/MultipleInputFeatureRequirement
      description: A CWL requirement enabling an input to accept multiple values.
    StepInputExpressionRequirement:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/StepInputExpressionRequirement
      description: A CWL requirement enabling expressions in workflow step inputs.
    SubworkflowFeatureRequirement:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/SubworkflowFeatureRequirement
      description: A CWL requirement enabling nested sub-workflows.
    CWLHints:
