    SoftwarePackageSpecs:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/SoftwarePackageSpecs
      description: The version specifications of a required software package.
    CQL2:
      $ref: schemas/cql2/cql2.yaml
      description: A CQL2 filter expression, constraining the inputs of a process per the OGC CQL2 standard.
    enumeration:
      $ref: schemas/dynamic/enumeration.yaml
      description: An input whose value must be one of an enumerated set of literals.
    processes-list:
      $ref: schemas/dynamic/processes-list.yaml
      description: A list of the processes available on this API.
    processSummary:
      $ref: schemas/processes-core/processSummary.yaml
      description: A summary of a process that can be executed by this API, including its machine-readable
