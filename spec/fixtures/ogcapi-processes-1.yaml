openapi: 3.0.0
info:
  version: 2.0rc1
  title: OGC API - Processes
  description: Example API Definition for OGC API - Processes
  contact:
    name: Open Geospatial Consortium
    email: info@ogc.org
  license:
    name: OGC License
    url: http://www.opengeospatial.org/legal/
servers:
- description: 'Example Server 1 (GNOSIS, supporting Part 1: Core /Sync and Part 3: Workflows)'
  url: https://maps.gnosis.earth/ogcapi
- description: Example Server 2 (CRIM Hirondelle, supporting Parts 1, 2, 3, 4)
  url: https://hirondelle.crim.ca/ogcapi/processes
paths:
  /:
    $ref: paths/common-core/pLandingPage.yaml
  /conformance:
    $ref: paths/common-core/pConformance.yaml
  /api:
    $ref: paths/common-core/pAPI.yaml
  /api/processes-list:
    $ref: paths/dynamic/pAllProcesses.yaml
  /processes:
    $ref: paths/processes-provenance/pProcessListDeployMetadata.yaml
  /processes/{processID}:
    $ref: paths/processes-dru/pProcessDescriptionReplaceUndeploy.yaml
  /processes/{processID}/package:
    $ref: paths/processes-dru/pPackage.yaml
  /processes/{processID}/execution:
    $ref: paths/processes-workflows/pExecution-workflows.yaml
  /jobs:
    get:
      $ref: paths/processes-core/operations/oProcessList.yaml
    post:
      $ref: paths/processes-job-management/operations/oJobCreate.yaml
  /jobs/{jobID}:
    $ref: paths/processes-core/pJob.yaml
  /jobs/{jobID}/results:
    get:
      $ref: paths/processes-core/operations/oJobResults.yaml
    post:
      $ref: paths/processes-job-management/operations/oJobResultsStart.yaml
  /jobs/{jobID}/results/{outputID}:
    $ref: paths/processes-core/pResultOutput.yaml
  /jobs/{jobID}/results/{outputID}/{N}:
    $ref: paths/processes-core/pResultOutputValue.yaml
  /jobs/{jobID}/definition:
    $ref: paths/processes-job-management/pJobDefinition.yaml
  /jobs/{jobID}/prov:
    $ref: paths/processes-job-management/pJobProvenance.yaml
components:
  schemas:
    confClasses:
      $ref: schemas/common-core/confClasses.yaml
      description: The conformance classes the deployment implements, per the OGC API conformance declaration.
    link:
      $ref: schemas/common-core/link.yaml
      description: A hyperlink with its relation type, per the OGC API link conventions.
    landingPage:
      $ref: schemas/common-core/landingPage.yaml
      description: 'The landing page of the API: links to the conformance declaration, collections and
        processes.'
    exception:
      $ref: schemas/common-core/exception.yaml
      description: An exception report describing why a request failed, per the OGC API exception convention.
    collections:
      $ref: schemas/common-geodata/collections.yaml
      description: A list of the collections available on this API.
    collectionDesc:
      $ref: schemas/common-geodata/collectionDesc.yaml
      description: A description of a collection that hosts the results of a job.
    extent:
      $ref: schemas/common-geodata/extent.yaml
      description: The spatial and temporal extent of a collection or deployment.
    extent-UAD:
      $ref: schemas/common-geodata/extent-UAD.yaml
      description: The extent of a collection with unknown, unlimited or multi-dimensional axes.
    crs:
      $ref: schemas/crs/crs.yaml
      description: The coordinate reference systems supported for spatial inputs and outputs.
    dataType:
      $ref: schemas/common-geodata/dataType.yaml
      description: A data type declaration for an input or output value.
    timeStamp:
      $ref: schemas/common-geodata/timeStamp.yaml
      description: The timestamp of the response, per RFC 3339.
    numberReturned:
      $ref: schemas/common-geodata/numberReturned.yaml
      description: The number of items returned in this response.
    numberMatched:
      $ref: schemas/common-geodata/numberMatched.yaml
      description: The number of items matching the selection criteria, if the server can determine it.
    CWL:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/CWL
      description: A Common Workflow Language (CWL) process definition embedded in an OGC App-Pkg deployment.
    cwltool_CUDARequirement:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/cwltool_CUDARequirement
      description: The cwltool CUDA requirement for GPU-accelerated executions.
    CWLAtomic:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/CWLAtomic
      description: A single (non-composite) CWL value of an input or output.
    CWLAtomicNested:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/CWLAtomicNested
      description: A CWL scalar value nested inside a composite type.
    CWLGraph:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/CWLGraph
      description: 'A CWL workflow graph: the steps and their dependencies.'
    CWLWorkflow:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/CWLWorkflow
      description: 'A CWL workflow: a directed graph of steps composing tools into an analysis.'
    CWLWorkflowClass:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/CWLWorkflowClass
      description: The class marker (Workflow) of a CWL workflow definition.
    CWLWorkflowBase:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/CWLWorkflowBase
      description: The base definition shared by CWL workflow descriptions.
    CWLWorkflowSteps:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/CWLWorkflowSteps
      description: The steps of a CWL workflow.
    CWLInputsDefinition:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/CWLInputsDefinition
      description: The inputs section of a CWL process definition.
    CWLOutputsDefinition:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/CWLOutputsDefinition
      description: The outputs section of a CWL process definition.
    CWLWorkflowStepMap:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/CWLWorkflowStepMap
      description: The steps of a CWL workflow given as a map.
    CWLWorkflowStepList:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/CWLWorkflowStepList
      description: The steps of a CWL workflow given as a list.
    CWLInputList:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/CWLInputList
      description: The input parameters of a CWL process given as a list.
    CWLInputMap:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/CWLInputMap
      description: The input parameters of a CWL process given as a map.
    ResourceQuantityOrFractional:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/ResourceQuantityOrFractional
      description: A CWL resource allocation given as a quantity or a fraction of the available resources.
    CWLExpression:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/CWLExpression
      description: A CWL expression evaluated at runtime to derive parameter values.
    InitialWorkDirListing:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/InitialWorkDirListing
      description: The listing of files staged into the working directory before a CWL execution.
    CWLRequirementsMap:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/CWLRequirementsMap
      description: The requirements of a CWL process given as a map.
    CWLRequirements:
      $ref: schemas/cwl/cwl-json-schema.yaml#/$defs/CWLRequirements
      description: 'The requirements of a CWL process: mandatory features the execution platform must
